<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard - PetSitterHub</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">

    </head>
    <body class="bg-light">
        <nav class="nav navbar-expland-lg navbar-light bg-primary shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold text-dark" href="index.html">PetSitterHub</a>
                <div class="navbar-nav ms-auto">
                    <span id="nomeUtente" class="nav-link text-dark fw-bold"></span>
                    <a class="nav-link text-danger" href="#" onclick="logout()">Esci</a>

                </div>
            </div>
        </nav>
        <div class="container py-5">
            <h2 class="mb-4">La mia Lista dashboard</h2>
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card shadow-sm text-center p-3 bg-success text-white">
                        <h1 id="totalePrenotazioni">0</h1>
                        <p>Prenotazioni Totali</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card shadow-sm text-center p-3 bg-warning">
                        <h1 id="prenotazioniAttesa">0</h1>
                        <p>InAttesa</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card shadow-sm text-center p-3 bg-primary text-white">
                        <h1 id="prenotazioniAcettate">0</h1>
                        <p> Accettate</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card shadow-sm text-center p-3 bg-secondary text-white">
                        <h1 id="totaleRecensioni">0</h1>
                        <p>Recensioni</p>
                    </div>
                </div>
            </div>
            <div class="card shadow-sm p-4 mb-4">
                <h4> Lista delle mie prenotazioni</h4>
                <div id="listaPrenotazioni" class="mt-3">
                    <p class="text-muted">Caricamento..</p>
                </div>
            </div>
            <div class="card shadow-sm p-4 mb-4">
                <h4> I miei Messaggi </h4>
                <div id="listaMessaggi" class="mt-3">
                    <p class="text-muted">Caricamento..</p>
                </div>
                <hr>
                <h6>Invia messaggi </h6>
                <div class="input-group mt-2">
                    <input type="number" id="destinatarioId" class="form-control" placeholder="ID destinatario">
                    <input type="text" id="testoMessaggi" class="form-control" placeholder="Scrivi un messaggio..">
                    <botton class="btn btn-success" onclick="InviaMessaggio()">Invia</botton>
                </div>
            </div>
            <div class="card shadow-sm p-4">
                <h4>Le mie recensioni</h4>
                <div id="listaRecensioni" class="mt-3">
                    <p class="text-muted">Caricamento..</p>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/main.js"></script>
        <script>
            window.onload = function(){
                caricaDashboard();
            }
        </script>
    </body>
</html>
